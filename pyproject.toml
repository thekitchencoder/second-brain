[project]
name = "second-brain"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
full = ["psycopg[binary,pool]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = ["integration: requires Docker and a running embedding model (deselect with '-m not integration')"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
    "ignore:urllib3 v2 only supports OpenSSL:UserWarning",
]
