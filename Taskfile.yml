# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['.env.local']

vars:
  IMAGE: second-brain-dev:latest
  CONTAINER: brain
  VOL_CLAUDE: brain-dev-claude
  VOL_CODESERVER: brain-dev-codeserver
  VOL_ZSH: brain-dev-zsh

tasks:
  default:
    desc: List available tasks
    cmd: task --list
    silent: true

  build:
    desc: Build the dev image (layer-cached — fast after first build)
    cmd: docker build -t {{.IMAGE}} .

  up:
    desc: Start the container (bind-mounts tools/lib; set PROFILE_HOST_PATH in .env.local to seed fresh brains from a local profile checkout)
    cmd: >
      docker run -d
      --name {{.CONTAINER}}
      -v "{{.BRAIN_HOST_PATH}}:/brain"
      -v {{.VOL_CLAUDE}}:/home/coder/.claude
      -v {{.VOL_CODESERVER}}:/home/coder/.local/share/code-server
      -v {{.VOL_ZSH}}:/home/coder/.zsh-data
      -v "{{.ROOT_DIR}}/tools/lib:/usr/local/lib/brain-tools/lib"
      {{if .PROFILE_HOST_PATH}}-v "{{.PROFILE_HOST_PATH}}:/profile-src" -e BRAIN_PROFILE_REPO=/profile-src{{end}}
      -p 7779:7779
      -p 7780:7780
      -e BRAIN_DEV=1
      {{.IMAGE}}

  down:
    desc: Stop and remove the container
    cmd: docker stop {{.CONTAINER}} && docker rm {{.CONTAINER}}

  restart:
    desc: Restart — picks up entrypoint/skill changes; skills are force-reseeded on start
    cmds:
      - task: down
      - task: up

  logs:
    desc: Tail container logs
    cmd: docker logs -f {{.CONTAINER}}

  shell:
    desc: Open a shell in the running container
    interactive: true
    cmd: docker exec -it {{.CONTAINER}} zsh

  sync-skills:
    desc: Copy skills from the profile checkout into the running container (set PROFILE_HOST_PATH in .env.local)
    preconditions:
      - sh: test -n "{{.PROFILE_HOST_PATH}}"
        msg: "Set PROFILE_HOST_PATH in .env.local to a local brain-profile checkout (e.g. ~/projects/brain-profile-ace)"
    cmds:
      - docker cp {{.PROFILE_HOST_PATH}}/skills/global/. {{.CONTAINER}}:/home/coder/.claude/skills/
      - docker cp {{.PROFILE_HOST_PATH}}/skills/vault/. {{.CONTAINER}}:/home/coder/.claude/skills/
      - echo "Skills synced — run /reload in Claude Code."

  sync:
    desc: Full sync — skills + Python lib + templates (no restart, no rebuild)
    cmds:
      - task: sync-skills
      - docker cp tools/lib/. {{.CONTAINER}}:/usr/local/lib/brain-tools/lib/
      - echo "Full sync complete."

  test:
    desc: Run unit tests in a container (full coverage including SQLite/sqlite-vec)
    cmd: >
      docker run --rm --entrypoint python3
      -v "{{.ROOT_DIR}}/tests:/usr/local/lib/brain-tools/tests"
      -v "{{.ROOT_DIR}}/tools/lib:/usr/local/lib/brain-tools/lib"
      -v "{{.ROOT_DIR}}/tools/brain-init:/usr/local/lib/brain-tools/brain-init"
      -v "{{.ROOT_DIR}}/tools/brain-profile:/usr/local/lib/brain-tools/brain-profile"
      -v "{{.ROOT_DIR}}/tools/setup.sh:/usr/local/lib/brain-tools/setup.sh"
      -v "{{.ROOT_DIR}}/tools/brain_mcp_server.py:/usr/local/lib/brain-tools/brain_mcp_server.py"
      -v "{{.ROOT_DIR}}/tools/brain_api.py:/usr/local/lib/brain-tools/brain_api.py"
      -v "{{.ROOT_DIR}}/tools/brain_index.py:/usr/local/lib/brain-tools/brain_index.py"
      -v "{{.ROOT_DIR}}/tools/brain_search.py:/usr/local/lib/brain-tools/brain_search.py"
      -v "{{.ROOT_DIR}}/pyproject.toml:/usr/local/lib/brain-tools/pyproject.toml"
      -w /usr/local/lib/brain-tools
      {{.IMAGE}}
      -m pytest -m "not integration"

  test-integration:
    desc: Run integration tests (needs Docker Model Runner with an embedding model)
    cmd: >
      python3 -m pytest -m integration -v --ignore=tests/test_brain_api.py
    env:
      SECOND_BRAIN_IMAGE: '{{.IMAGE}}'
      EMBEDDING_BASE_URL: http://model-runner.docker.internal/engines/llama.cpp/v1
      EMBEDDING_MODEL: '{{.EMBEDDING_MODEL | default "ai/embeddinggemma:latest"}}'
